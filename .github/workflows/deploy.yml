name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # .GitInfo(마지막 커밋 링크)용
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - name: Install PyYAML
        run: python3 -c "import yaml" || pip install --break-system-packages pyyaml || pip install pyyaml
      - name: Check content
        run: ./scripts/check.sh
      - name: Export references (BibTeX, CSL-JSON)
        run: |
          python3 scripts/kb.py bib > static/references.bib
          python3 scripts/kb.py csl > static/references.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
