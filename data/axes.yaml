# 책의 뼈대가 되는 두 축. 항목의 lifecycle/controls 값은 반드시 아래 key 중에서 고른다.
# 사람(저자)이 관리한다. 스케줄 작업은 이 파일을 수정하지 않는다.

lifecycle:
  - key: data
    label: 데이터
    order: 1
    desc: "학습·튜닝·RAG에 들어가는 데이터의 수집·저장·출처. 데이터 포이즈닝, 학습 데이터 노출, RAG 코퍼스 오염, 데이터 레이크 노출"
  - key: training
    label: 학습·튜닝
    order: 2
    desc: "사전학습·파인튜닝·정렬·평가 파이프라인. 백도어, 정렬 우회의 원인, 평가·채점기의 허점, 학습 중 에이전트 행동"
  - key: serving
    label: 서빙·추론
    order: 3
    desc: "모델 API·추론 엔드포인트·LLM 애플리케이션. 직접 프롬프트 인젝션, 탈옥, 모델 추출·증류, API 키 남용, 추론 최적화의 부작용"
  - key: agent-runtime
    label: 에이전트 런타임
    order: 4
    desc: "모델이 도구·파일·네트워크·자격 증명에 닿는 실행 단계. 간접 인젝션, 도구 호출, MCP, 코딩·브라우저 에이전트, 권한 경계 이탈"
  - key: supply-chain
    label: 공급망·배포
    order: 5
    desc: "모델·패키지·플러그인·MCP 서버·CI/CD가 들어오고 배포되는 경로. 악성 모델·패키지, 레지스트리, 직렬화, 서드파티 플랫폼 침해, 조달"

controls:
  - key: identity
    label: 신원·권한
    order: 1
    desc: "워크로드·에이전트 신원, 인가 범위, 토큰·API 키·시크릿 관리, 최소 권한, 승인 단계"
  - key: network
    label: 네트워크·egress
    order: 2
    desc: "외부 호출 허용 목록, egress 차단, 노출된 관리 인터페이스, 데이터 유출 경로 차단"
  - key: isolation
    label: 격리·실행 환경
    order: 3
    desc: "샌드박스, 컨테이너·devcontainer, 렌더링·미리보기 격리, 실행 권한 분리, 계획과 실행의 분리"
  - key: provenance
    label: 공급망·출처
    order: 4
    desc: "SBOM/AI-BOM, 서명·출처 증명(SLSA), 승인된 모델·패키지 레지스트리, 의존성·버전 고정"
  - key: detection
    label: 탐지·평가
    order: 5
    desc: "로깅·행동 분석·이상 탐지, 레드팀·평가 지표, 가드레일, 사고 대응"
  - key: governance
    label: 거버넌스·정책
    order: 6
    desc: "리스크 등록부, 조직 정책, 표준(OWASP·NIST·MITRE), 규제·조달 요건, 벤더 관리"

# 항목 유형
types: ["사고", "취약점", "연구", "표준·정책", "벤더 발표", "분석·관점", "기초 문헌"]

# 기존 뉴스 분류 (사이트 카테고리 필터와 연속성 유지용)
categories: ["프롬프트 인젝션", "에이전트·MCP 보안", "모델 공격 연구", "AI 공급망", "개인정보·데이터 유출", "AI 악용 공격", "규제·표준·거버넌스"]

# 출처 등급
tiers:
  1: "1차 — 연구자·벤더·기관이 직접 낸 원문 (논문, 보안 권고, GHSA/CVE, 공식 블로그·발표, 관보, 표준 문서)"
  2: "2차 — 원문을 확인해 보도한 전문 매체 (보안·IT 전문지, 주요 언론)"
  3: "3차 — 집계·요약 블로그, 주간 정리, 출처가 불분명한 2차 가공물"
