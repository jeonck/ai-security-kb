{{ define "main" }}
<article>
  <header class="page-head">
    <p class="eyebrow"><a href="{{ .Parent.RelPermalink }}">BOOK</a>{{ with .Params.updated }} · 갱신 {{ . }}{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  {{ if .TableOfContents }}<details class="toc"><summary>목차</summary>{{ .TableOfContents }}</details>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
